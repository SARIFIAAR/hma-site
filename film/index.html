<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HMA — The Architecture Assembles (motion test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --gold:#e3c488; --soft:#d8c7a6; --ivory:#f8f3ea; --dur:32s; }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .frame{position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh;aspect-ratio:16/9;overflow:hidden}
  .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
         animation:var(--dur) linear infinite both}
  .l1{animation-name:L1}.l2{animation-name:L2}.l3{animation-name:L3}.l4{animation-name:L4}.l5{animation-name:L5}
  /* each layer: fade in, hold with slow zoom, fade out */
  @keyframes L1{0%{opacity:0;transform:scale(1.06)}3%{opacity:1}17%{opacity:1}21%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
  @keyframes L2{0%{opacity:0}17%{opacity:0;transform:scale(1.06)}21%{opacity:1}35%{opacity:1}39%{opacity:0;transform:scale(1.13)}100%{opacity:0}}
  @keyframes L3{0%{opacity:0}35%{opacity:0;transform:scale(1.06)}39%{opacity:1}55%{opacity:1}59%{opacity:0;transform:scale(1.13)}100%{opacity:0}}
  @keyframes L4{0%{opacity:0}55%{opacity:0;transform:scale(1.06)}59%{opacity:1}74%{opacity:1}78%{opacity:0;transform:scale(1.13)}100%{opacity:0}}
  @keyframes L5{0%{opacity:0}74%{opacity:0;transform:scale(1.05)}78%{opacity:1}96%{opacity:1}100%{opacity:1;transform:scale(1.13)}}

  /* vignette for text legibility */
  .vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(130% 120% at 50% 42%,transparent 48%,rgba(0,0,0,.62) 100%),
                  linear-gradient(0deg,rgba(0,0,0,.62),transparent 40%)}

  /* ivory text + strong dark halo so it reads over the gold glow */
  .txt{position:absolute;color:var(--ivory);opacity:0;animation:var(--dur) ease infinite both;
       text-shadow:0 0 3px rgba(0,0,0,.92),0 0 14px rgba(0,0,0,.85),0 3px 26px rgba(0,0,0,.75)}
  .center{left:0;right:0;text-align:center}
  .serif{font-family:"Cormorant Garamond",serif}
  .sans{font-family:"Inter",sans-serif;font-weight:400}

  /* intention line */
  .t-intent{top:46%;font-style:italic;font-size:clamp(1.1rem,2.6vw,2rem);animation-name:T_INTENT}
  @keyframes T_INTENT{0%{opacity:0;transform:translateY(10px)}7%{opacity:.95;transform:none}15%{opacity:.95}18%{opacity:0}100%{opacity:0}}

  /* title card */
  .t-title{bottom:16%;font-size:clamp(1.6rem,4.6vw,3.6rem);letter-spacing:.14em;font-weight:600}
  .t-title{animation-name:T_TITLE}
  .t-sub{bottom:11%;font-size:clamp(.7rem,1.5vw,1rem);letter-spacing:.4em;color:var(--soft);animation-name:T_SUB}
  @keyframes T_TITLE{0%{opacity:0;letter-spacing:.42em}21%{opacity:0}26%{opacity:1;letter-spacing:.14em}35%{opacity:1}39%{opacity:0}100%{opacity:0}}
  @keyframes T_SUB{0%{opacity:0}27%{opacity:0}30%{opacity:.9}35%{opacity:.9}38%{opacity:0}100%{opacity:0}}

  /* lower-third label 1 */
  .ll{left:7%;text-align:left}
  .t-num{bottom:30%;font-size:clamp(.7rem,1.4vw,.95rem);letter-spacing:.3em;color:var(--soft);animation-name:T_NUM1}
  .t-l1{bottom:21%;font-size:clamp(1.8rem,4.4vw,3.2rem);font-weight:600;color:#f5f0e6;animation-name:T_L1}
  .t-c1{bottom:16%;font-size:clamp(.7rem,1.4vw,.95rem);letter-spacing:.28em;color:var(--soft);animation-name:T_C1}
  @keyframes T_NUM1{0%{opacity:0}40%{opacity:0;transform:translateX(-14px)}44%{opacity:.9;transform:none}55%{opacity:.9}58%{opacity:0}100%{opacity:0}}
  @keyframes T_L1{0%{opacity:0}41%{opacity:0;transform:translateX(-18px)}46%{opacity:1;transform:none}55%{opacity:1}58%{opacity:0}100%{opacity:0}}
  @keyframes T_C1{0%{opacity:0}44%{opacity:0}48%{opacity:.9}55%{opacity:.9}58%{opacity:0}100%{opacity:0}}

  /* four dimensions */
  .t-dims{top:34%;font-family:"Cormorant Garamond",serif;font-size:clamp(1.3rem,3.4vw,2.6rem);line-height:1.8;animation-name:T_DIMS;
          padding:1.1rem 0;background:radial-gradient(ellipse 42% 80% at 50% 50%,rgba(0,0,0,.66),rgba(0,0,0,0) 72%)}
  .t-dims span{display:block}
  @keyframes T_DIMS{0%{opacity:0}60%{opacity:0;transform:translateY(12px)}64%{opacity:1;transform:none}75%{opacity:1}78%{opacity:0}100%{opacity:0}}

  /* integration -> purpose -> outcomes */
  .t-integ{top:40%;font-size:clamp(2rem,6vw,4rem);letter-spacing:.2em;font-weight:600;animation-name:T_INTEG;
           padding:.8rem 0;background:radial-gradient(ellipse 38% 90% at 50% 50%,rgba(0,0,0,.6),rgba(0,0,0,0) 72%)}
  @keyframes T_INTEG{0%{opacity:0}79%{opacity:0;transform:scale(.96)}83%{opacity:1;transform:none}88%{opacity:1}90%{opacity:0}100%{opacity:0}}
  .t-purpose{top:40%;font-size:clamp(2rem,6vw,4rem);letter-spacing:.2em;font-weight:600;animation-name:T_PURP;
             padding:.8rem 0;background:radial-gradient(ellipse 38% 90% at 50% 50%,rgba(0,0,0,.6),rgba(0,0,0,0) 72%)}
  @keyframes T_PURP{0%{opacity:0}89%{opacity:0;transform:scale(.96)}92%{opacity:1;transform:none}95%{opacity:1}97%{opacity:0}100%{opacity:0}}
  .t-out{bottom:13%;font-family:"Inter",sans-serif;font-weight:400;font-size:clamp(.8rem,1.8vw,1.15rem);letter-spacing:.3em;color:var(--soft);animation-name:T_OUT}
  @keyframes T_OUT{0%{opacity:0}92%{opacity:0}95%{opacity:.95}100%{opacity:.95}}
</style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <img class="layer l1" src="1.jpg" alt="">
      <img class="layer l2" src="2.jpg" alt="">
      <img class="layer l3" src="3.jpg" alt="">
      <img class="layer l4" src="4.jpg" alt="">
      <img class="layer l5" src="5.jpg" alt="">
      <div class="vig"></div>

      <div class="txt center serif t-intent">Everything begins with a single intention.</div>

      <div class="txt center serif t-title">THE&nbsp;HUMAN&nbsp;MASTERY&nbsp;ARCHITECTURE</div>
      <div class="txt center sans t-sub">ARCHITECT&nbsp;WHAT&nbsp;MATTERS&nbsp;MOST</div>

      <div class="txt ll sans t-num">01</div>
      <div class="txt ll serif t-l1">Mind&nbsp;&amp;&nbsp;Body</div>
      <div class="txt ll sans t-c1">ONE&nbsp;INTEGRATED&nbsp;SYSTEM</div>

      <div class="txt center t-dims">
        <span>Behaviour</span><span>Relationships</span><span>Impact</span><span>Spirituality</span>
      </div>

      <div class="txt center serif t-integ">INTEGRATION</div>
      <div class="txt center serif t-purpose">PURPOSE</div>
      <div class="txt center t-out">CLARITY&nbsp;·&nbsp;PERFORMANCE&nbsp;·&nbsp;BALANCE&nbsp;·&nbsp;MEANING</div>
    </div>
  </div>
</body>
</html>
